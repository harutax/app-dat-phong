global:
  scrape_interval: 15s
scrape_configs:
  - job_name: app-dat-phong
    metrics_path: /api/v1/actuator/prometheus
    # Prometheus KHÔNG thay biến môi trường trong file cấu hình: token được entrypoint (docker-compose) ghi ra file.
    http_headers:
      X-Metrics-Token:
        files: ["/tmp/metrics_token"]
    static_configs:
      - targets: ["app:8080"]
